name: Deploy to GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          # Site lives at https://shivendrasinghtanwar.github.io/melange-26/
          VITE_BASE: /melange-26/
          # The Google Apps Script Web App URL that the RSVP form POSTs to.
          # Set via: gh secret set APPS_SCRIPT_URL --body 'https://script.google.com/macros/s/.../exec'
          VITE_APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
